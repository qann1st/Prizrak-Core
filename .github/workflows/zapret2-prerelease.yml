name: zapret2 Windows prerelease

on:
  push:
    branches: [codex/zapret2-test]

permissions:
  contents: read

concurrency:
  group: zapret2-prerelease-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: zapret2-test-${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: '1.26'
      - name: Build and package Windows x64
        run: |
          cp /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt
          mkdir -p dist "$RUNNER_TEMP/zapret2-package"
          package="$RUNNER_TEMP/zapret2-package"
          cp .github/release/zapret2/* LICENSE "$package/"
          build_time=$(date -u)
          for variant in compatible v3; do
            goamd64=v1
            if [[ "$variant" == v3 ]]; then goamd64=v3; fi
            GOOS=windows GOARCH=amd64 GOAMD64="$goamd64" go build -tags with_gvisor -trimpath \
              -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=$RELEASE_TAG' -X 'github.com/metacubex/mihomo/constant.BuildTime=$build_time' -s -w -buildid=" \
              -o "$package/prizrak-core.exe" .
            (cd "$package" && zip -q "$GITHUB_WORKSPACE/dist/prizrak-core-windows-amd64-$variant-$RELEASE_TAG.zip" ./*)
          done
          (cd dist && sha256sum ./*.zip > checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zapret2
          path: dist/*
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-zapret2
      - name: Validate Prizrak-Core and winws2 configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "prizrak-core-windows-amd64-compatible-$env:RELEASE_TAG.zip"
          $testDirectory = Join-Path $env:RUNNER_TEMP 'zapret2 smoke test'
          Expand-Archive -LiteralPath $archive -DestinationPath $testDirectory
          Set-Location -LiteralPath $testDirectory
          & .\prizrak-core.exe -t -d . -f config.yaml
          if ($LASTEXITCODE -ne 0) { throw 'Prizrak-Core configuration test failed' }
          & .\setup-zapret2.ps1
          $profile = Get-Content -LiteralPath youtube-winws2.txt -Raw
          Set-Content -LiteralPath dry-run.txt -Encoding ascii -Value "--dry-run`n$profile"
          & .\zapret2-v1.0.7\binaries\windows-x86_64\winws2.exe '@dry-run.txt'
          if ($LASTEXITCODE -ne 0) { throw 'winws2 configuration test failed' }

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-zapret2
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c checksums.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Prizrak-Core + zapret2 ($RELEASE_TAG)" \
            --notes 'Тестовая сборка Windows x64. В ZIP есть README, профиль YouTube для TLS и QUIC и скрипт установки официального zapret2 v1.0.7 с проверкой SHA-256. winws2 запускается отдельным процессом. Для первого теста скачайте ZIP с compatible.' \
            ./*.zip checksums.txt
